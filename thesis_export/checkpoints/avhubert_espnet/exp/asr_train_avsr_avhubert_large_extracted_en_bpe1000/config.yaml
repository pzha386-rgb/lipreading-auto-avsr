    encoder_layers: 24
    dropout: 0.1
    dropout_features: 0.1
    encoder_layerdrop: 0.05
    attention_dropout: 0.1
    extracted: true
    freeze_finetune_updates: 10000
    feature_grad_mult: 1.0
postencoder: null
postencoder_conf: {}
decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 4096
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
preprocessor: default
preprocessor_conf: {}
required:
- output_dir
- token_list
version: '202308'
distributed: true
